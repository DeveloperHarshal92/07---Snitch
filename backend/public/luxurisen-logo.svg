<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="luxGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEBA7E" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#A88748" />
    </linearGradient>
  </defs>

  <!-- Luxury Atelier Crest -->
  <g fill="none" stroke="url(#luxGoldGrad)" stroke-linecap="round" stroke-linejoin="round" transform="translate(175, 70)">
    <!-- Outer Octagonal / Faceted Diamond Frame -->
    <path
      d="M 125 15 L 215 80 L 235 170 L 125 240 L 15 170 L 35 80 Z"
      stroke-width="3.5"
      stroke-opacity="0.5"
    />
    
    <!-- Inner Concentric Frame -->
    <path
      d="M 125 32 L 200 87 L 218 162 L 125 222 L 32 162 L 50 87 Z"
      stroke-width="1.5"
      stroke-opacity="0.8"
    />

    <!-- Symmetrical Diamond Apex & Star Facet -->
    <path d="M 125 45 L 125 210" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4" />
    <path d="M 50 127 L 200 127" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4" />

    <!-- Central Interlocking Monogram 'L' & 'X' (Luxurisen) -->
    <!-- Stylized 'L' -->
    <path
      d="M 100 75 L 100 175 L 160 175"
      stroke-width="8"
      stroke="#C9A96E"
    />
    <!-- Accenting Stylized Serif Bar -->
    <path
      d="M 90 75 L 115 75"
      stroke-width="6"
      stroke="#C9A96E"
    />
    <path
      d="M 160 165 L 160 185"
      stroke-width="5"
      stroke="#C9A96E"
    />

    <!-- Diagonal Sartorial Cross Cut -->
    <path
      d="M 145 85 L 105 165"
      stroke-width="4.5"
      stroke="#DEBA7E"
      stroke-opacity="0.9"
    />

    <!-- Top & Bottom Micro Jewels -->
    <polygon points="125,52 130,60 125,68 120,60" fill="#C9A96E" stroke="none" />
    <polygon points="125,188 130,196 125,204 120,196" fill="#C9A96E" stroke="none" />
  </g>

  <!-- Brand Typography -->
  <text
    x="300"
    y="395"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif"
    font-size="44"
    font-weight="500"
    letter-spacing="0.32em"
    fill="url(#luxGoldGrad)"
  >
    LUXURISEN
  </text>

  <!-- Subtitle Tagline -->
  <text
    x="300"
    y="435"
    text-anchor="middle"
    font-family="'Inter', -apple-system, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="0.45em"
    fill="#8c827a"
  >
    HAUTE COUTURE · ATELIER
  </text>
</svg>
