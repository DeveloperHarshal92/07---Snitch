<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#A88748" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1410" />
      <stop offset="100%" stop-color="#0d0d0b" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Luxury Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Subtle Inner Stitch Rim -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#C9A96E" stroke-opacity="0.25" stroke-dasharray="2 2" stroke-width="1" />

  <!-- Stylized Luxury "S" Emblem -->
  <path d="M40.5 21.5 C39 16.5 35 14.5 30 14.5 C23 14.5 18 18.5 18 24.5 C18 34 38 31 38 41 C38 46.5 33 49.5 26.5 49.5 C20.5 49.5 16 46.5 14.5 41" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Tailoring Spark / Stitch Diamond Accent -->
  <polygon points="45,17 46.5,19.5 49,21 46.5,22.5 45,25 43.5,22.5 41,21 43.5,19.5" fill="url(#goldGrad)" />
</svg>